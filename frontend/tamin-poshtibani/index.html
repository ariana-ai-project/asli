<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تدارکات | سامانه هوشمند آریانا</title>
  <meta name="description" content="سامانه پشتیبانی خرید و تدارکات — پنل مدیریتی و پنل کارشناسی" />
  <meta name="theme-color" content="#030814" />
  <link rel="icon" type="image/jpeg" href="../assets/logo-new.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css?v=8" />
  <style>
    /* این صفحه از انیمیشن ورود لوگوموشن سایت اصلی مستقل است */
    body { overflow-x: hidden; overflow-y: auto; display: flow-root; min-height: 100vh; min-height: 100dvh; }

    /* پس‌زمینهٔ کل صفحه: «مه ساحلی» (Coastal Fog) از نمونهٔ اسکیل liquid-glass (MIT) — گرادیان
       CSS است، نه تصویر، پس در هر رزولوشنی تیز می‌ماند. ثابت روی پنجره (fixed) تا با اسکرول
       افقِ روشن سر جایش بماند و لبهٔ عدسیِ کارت‌ها (کرومیوم دسکتاپ) از رویش رد شود. */
    .tp-fog {
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(90% 70% at 72% 18%, rgba(255, 233, 204, 0.55), transparent 60%),
        radial-gradient(60% 40% at 20% 70%, rgba(120, 150, 150, 0.35), transparent 70%),
        linear-gradient(180deg, #2e4150 0%, #5f7a86 38%, #aebcb9 58%, #6d8388 60%, #3b5260 72%, #1f2e37 100%);
    }
    /* رنگ متن‌ها روی مه: بالای صفحه تیره است (سرمه‌ای-خاکستری) و متن سفید خواناست؛ سایهٔ نرم
       برای وقتی که عنوان روی لبهٔ روشن‌ترِ مه می‌افتد (پنجره‌های کوتاه) */
    .tp-header { padding: 28px 0 8px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    /* جعبهٔ کوچکِ چرخ‌دنده — بالا-چپ (انتهای سطر راست‌به‌چپ): ورود به پنل «پشتیبانی» (support.html) */
    .tp-gear {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 12px;
      color: rgba(232, 240, 250, 0.9); font-size: 0.85rem; text-shadow: 0 1px 8px rgba(10, 20, 30, 0.5);
      background: rgba(12, 24, 44, 0.42); border: 1px solid rgba(255, 255, 255, 0.24);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 4px 14px -6px rgba(0, 0, 0, 0.5);
      transition: background-color .2s ease, color .2s ease;
    }
    .tp-gear:hover { background: rgba(20, 38, 66, 0.62); color: #ffffff; }
    .tp-gear:focus-visible { outline: 2px solid #9ec5ff; outline-offset: 2px; }
    .tp-gear svg { width: 16px; height: 16px; }
    .tp-back { display: inline-flex; align-items: center; gap: 6px; color: rgba(232, 240, 250, 0.86); font-size: 0.95rem; text-shadow: 0 1px 8px rgba(10, 20, 30, 0.5); }
    .tp-back:hover { color: #ffffff; }
    .tp-hero { text-align: center; padding: 40px 0 8px; }
    .tp-hero .eyebrow { display: inline-block; margin-bottom: 14px; border-color: rgba(255, 255, 255, 0.3); background: rgba(20, 34, 48, 0.42); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18); }
    .tp-hero h1 { font-size: var(--step-4); font-weight: 900; margin-bottom: 10px; color: #ffffff; text-shadow: 0 2px 18px rgba(10, 20, 30, 0.55); }
    .tp-hero p { color: rgba(232, 240, 250, 0.9); max-width: 620px; margin-inline: auto; text-shadow: 0 1px 10px rgba(10, 20, 30, 0.5); }

    .tp-grid {
      position: relative;
      display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
      width: min(1040px, calc(100% - 2 * clamp(16px, 5vw, 64px)));
      margin: 48px auto 80px;
      /* روی مهِ روشن، شیشه تیره‌تر و پُرتر است تا متن سفید خوانا بماند (اسکیل: روی پس‌زمینهٔ روشن،
         پرکننده بالا می‌رود) — عدد با عکسِ بی‌متن سنجیده شد */
      --lg-fill: rgba(12, 24, 44, 0.46);
      --lg-fill-static: rgba(12, 24, 44, 0.58);
      --lg-solid: #1c2c44;
      --lg-rim-key: rgba(255, 255, 255, 0.7);
      --lg-rim-back: rgba(255, 255, 255, 0.34);
    }
    @media (max-width: 720px) { .tp-grid { grid-template-columns: 1fr; } }
    /* main.js (که این صفحه بارگذاری نمی‌کند) معمولاً opacity کارت‌ها را با IntersectionObserver به ۱ می‌رساند؛ اینجا مستقیم فعال است */
    .tp-panel-card { min-height: 240px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 14px; padding: 40px 24px; opacity: 1 !important; transform: none !important; }
    .tp-panel-card .card-icon { width: 64px; height: 64px; border-radius: 18px; }
    .tp-panel-card .card-icon svg { width: 32px; height: 32px; }
    .tp-panel-card h3 { font-size: var(--step-2); }
    .tp-panel-card .tp-desc { color: rgba(232, 240, 250, 0.92); font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="tp-fog" aria-hidden="true"></div>

  <div class="container tp-header">
    <a class="tp-back" href="../index.html#services">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
      بازگشت به بخش‌های سامانه
    </a>
    <a class="tp-gear" href="support.html" title="پنل پشتیبانی — نظارت و تأیید کمیسیون" aria-label="پنل پشتیبانی">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      پشتیبانی
    </a>
  </div>

  <header class="container tp-hero">
    <p class="eyebrow glass">تدارکات</p>
    <h1>سامانه پشتیبانی خرید</h1>
    <p>مدیریت زنجیره تامین، ارجاع کارشناسی و پیگیری درخواست‌های خرید</p>
  </header>

  <main class="tp-grid">
    <a class="card tp-panel-card" href="manager.html" data-dept="tamin-poshtibani-manager" data-status="active">
      <span class="led" aria-hidden="true"></span>
      <span class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 4v4"/></svg>
      </span>
      <h3>پنل مدیریتی</h3>
      <span class="tp-desc">میز ارجاع، پایش SLA و تصمیم‌های مدیریتی</span>
    </a>

    <a class="card tp-panel-card" href="expert.html" data-dept="tamin-poshtibani-expert" data-status="active">
      <span class="led" aria-hidden="true"></span>
      <span class="card-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c1-4 4-6.5 7.5-6.5s6.5 2.5 7.5 6.5"/></svg>
      </span>
      <h3>پنل کارشناسی</h3>
      <span class="tp-desc">کارتابل، استعلام و پیگیری درخواست‌های ارجاع‌شده</span>
    </a>
  </main>

  <script src="../js/liquid-glass.js?v=8"></script>
</body>
</html>
