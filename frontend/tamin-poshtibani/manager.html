<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>میز ارجاع خرید | سامانه هوشمند آریانا</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#030814" />
  <link rel="icon" type="image/jpeg" href="../assets/logo-new.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="panel.css" />
  <!-- حالت شب/روز پیش از اولین رسم: وگرنه صفحه یک لحظه با رنگ‌های حالت دیگر می‌آید و بعضی عنصرها کم‌رنگ می‌مانند -->
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("tp.theme") === "light" ? "light" : "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }</script>
</head>
<body class="tp-body">
  <div id="app" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="shared.js"></script>
  <script src="import.js"></script>
  <script src="catalog-import.js"></script>
  <script type="module">
    /* قواعد یکسان‌سازی (عدد و واحد، جنس) — همان دو ماژولی که Worker و ورودگر می‌خوانند */
    import * as rules from "./catalog-rules.mjs";
    import { HEAD_RULES } from "./catalog-head-rules.mjs";
    /* حساب ارجاع و مهلت هوشمند — همان ماژولی که تست‌ها می‌خوانند */
    import * as plan from "./assign-rules.mjs";
    const TP = (window.TP = window.TP || {});
    TP.rules = { ...rules, HEAD_RULES };
    TP.plan = plan;
  </script>
  <script src="manager.js"></script>
</body>
</html>
