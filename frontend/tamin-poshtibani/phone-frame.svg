<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1621">
  <!-- قاب آیفون (تیتانیوم بنفش تیره) از روی تصویر مرجع مالک — پس‌زمینه شفاف؛ صفحه را خودِ صفحهٔ مکاتبات روی آن می‌گذارد -->
  <defs>
    <linearGradient id="kL" x1="0" x2="1"><stop offset="0" stop-color="#3a374c"/><stop offset=".35" stop-color="#8d88a2"/><stop offset=".6" stop-color="#d6d1e3"/><stop offset="1" stop-color="#5d596f"/></linearGradient>
    <linearGradient id="kR" x1="1" x2="0"><stop offset="0" stop-color="#3a374c"/><stop offset=".35" stop-color="#8d88a2"/><stop offset=".6" stop-color="#d6d1e3"/><stop offset="1" stop-color="#5d596f"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ebe7f4"/><stop offset=".22" stop-color="#a9a4bb"/><stop offset=".48" stop-color="#e2deec"/>
      <stop offset=".74" stop-color="#9792aa"/><stop offset="1" stop-color="#d9d4e5"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d687f"/><stop offset=".5" stop-color="#57536a"/><stop offset="1" stop-color="#6a657c"/>
    </linearGradient>
  </defs>
  <!-- دکمه‌ها: اکشن، صدا بالا و پایین در چپ؛ پاور در راست -->
  <rect x="0" y="292" width="16" height="55" rx="3.5" fill="url(#kL)"/>
  <rect x="0.5" y="397" width="16" height="112" rx="3.5" fill="url(#kL)"/>
  <rect x="0.5" y="547" width="16" height="110" rx="3.5" fill="url(#kL)"/>
  <rect x="762" y="480" width="17.5" height="177" rx="3.5" fill="url(#kR)"/>
  <!-- بدنه و لبهٔ تیتانیومی -->
  <rect x="7" y="0" width="764" height="1620" rx="145" fill="#2b2839"/>
  <rect x="9.5" y="2.5" width="759" height="1615" rx="142.5" fill="none" stroke="url(#rim)" stroke-width="3.2"/>
  <rect x="12.5" y="5.5" width="753" height="1609" rx="139.5" fill="url(#band)"/>
  <rect x="16.5" y="9.5" width="745" height="1601" rx="135.5" fill="#1d1b26"/>
  <rect x="19" y="12" width="740" height="1596" rx="133" fill="#030305"/>
  <!-- شکاف‌های آنتن روی لبه -->
  <rect x="600" y="0" width="6" height="12" fill="#3d394d"/>
  <rect x="172" y="1608" width="6" height="12" fill="#3d394d"/>
  <rect x="7" y="232" width="12" height="6" fill="#3d394d"/>
  <rect x="759" y="1386" width="12" height="6" fill="#3d394d"/>
  <!-- لبهٔ نمایشگر -->
  <rect x="44" y="31" width="691" height="1557" rx="109" fill="#050409" stroke="#16112f" stroke-width="2"/>
</svg>
