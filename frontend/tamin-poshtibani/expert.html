<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل کارشناس خرید | سامانه هوشمند آریانا</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#030814" />
  <link rel="icon" type="image/jpeg" href="../assets/logo-new.jpg" />
  <!-- نصب روی صفحهٔ اصلی (Add to Home Screen) و اعلان‌ها: آیفون فقط برای وب‌اپِ نصب‌شده اعلان می‌فرستد -->
  <link rel="manifest" href="manifest-expert.webmanifest" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="کارشناس خرید" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- فونت بی‌انتظار: اگر گوگل کند یا بسته باشد، صفحه با فونت سیستم باز می‌شود و Vazirmatn بعداً می‌رسد -->
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" /></noscript>
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="ui.css" />
  <!-- حالت شب/روز پیش از اولین رسم: وگرنه صفحه یک لحظه با رنگ‌های حالت دیگر می‌آید و بعضی عنصرها کم‌رنگ می‌مانند -->
  <script>try { document.documentElement.dataset.theme = localStorage.getItem("tp.theme") === "light" ? "light" : "dark"; } catch (e) { document.documentElement.dataset.theme = "dark"; }</script>
  <style>
    /* ---------- افزوده‌های پنل کارشناس ---------- */
    .strip { display: flex; gap: 8px; padding: 12px 18px; overflow-x: auto; border-bottom: 1px solid var(--tp-line); background: rgba(3,8,20,.35); }
    .pill { border: 1px solid var(--tp-line-2); background: rgba(120,165,255,.06); border-radius: 12px; padding: 8px 12px; white-space: nowrap; text-align: right; min-width: 190px; flex: 0 0 auto; }
    .pill.sel { border-color: var(--tp-accent); background: rgba(79,140,255,.16); box-shadow: inset 0 0 0 1px var(--tp-accent); }
    .pill .t { display: block; font-weight: 700; font-size: .9rem; cursor: pointer; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
    .pill .m { color: var(--tp-muted); font-size: .8rem; }
    .pill label { display: flex; align-items: center; gap: 6px; font-size: .8rem; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--tp-line); color: var(--tp-muted); cursor: pointer; }
    .pill.closed { opacity: .55; }
    .head { display: flex; gap: 18px; align-items: flex-start; padding: 14px 18px; border-bottom: 1px solid var(--tp-line); flex-wrap: wrap; }
    .head h2 { margin: 0; font-size: 1.1rem; }
    .head .right { margin-inline-start: auto; text-align: left; }
    .endbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: rgba(3,8,20,.35); border: 1px solid var(--tp-line); border-radius: 12px; padding: 10px 14px; margin: 12px 18px 0; }
    .tabs { display: flex; border-bottom: 1px solid var(--tp-line); overflow-x: auto; margin-top: 12px; }
    /* تب‌های زیرخط‌دار: تبِ انتخاب‌شده یک حباب شیشه‌ای ملایم هم روی خط می‌گیرد (توکن‌ها در panel.css) */
    .tab { background: none; border: none; border-bottom: 3px solid transparent; border-radius: 10px 10px 0 0; padding: 10px 18px; white-space: nowrap; color: var(--tp-muted); font-weight: 600; transition: background-color .2s ease, color .2s ease; }
    .tab:hover { color: var(--tp-fg); background: var(--gl-fill); }
    .tab.on { border-bottom-color: var(--tp-accent); color: var(--tp-fg); background: var(--gl-sheen), var(--gl-fill); box-shadow: var(--gl-rim); }
    .tab .cnt { background: var(--tp-accent); color: #fff; border-radius: 9px; padding: 0 7px; font-size: .75rem; margin-inline-start: 6px; }
    .pad { padding: 16px 18px; }
    .toolrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
    .two { display: flex; gap: 16px; align-items: flex-start; }
    .two .main { flex: 1; min-width: 0; }
    .two .side { flex: 0 0 300px; border: 1px solid var(--tp-line); border-radius: 12px; background: rgba(3,8,20,.35); padding: 14px; }
    .side h4 { margin: 0 0 4px; font-size: .95rem; }
    .side .grp { border-top: 1px solid var(--tp-line); padding-top: 10px; margin-top: 10px; }
    .side .grp b { display: block; font-size: .85rem; margin-bottom: 6px; }
    .side label { display: flex; gap: 7px; align-items: center; font-size: .85rem; padding: 2px 0; }
    .side .fld { margin-bottom: 7px; }
    .side .fld b { display: block; font-size: .78rem; color: var(--tp-muted); font-weight: 500; margin-bottom: 2px; }
    .side .fld input, .side .fld select, .side .fld textarea { width: 100%; }
    .side .two2 { display: flex; gap: 6px; }
    .q input, .q select { width: 100%; min-width: 80px; }
    .tokens { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
    .tok { border: 1px solid var(--gl-edge); background: var(--gl-sheen), var(--gl-fill); box-shadow: var(--gl-rim); border-radius: 8px; padding: 2px 9px; font-size: .82rem; }
    .tok:hover { background: var(--gl-sheen), var(--gl-fill-hover); }
    .tplbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .tplbtn { border: 1px solid var(--gl-edge); background: var(--gl-sheen), rgba(3,8,20,.35); box-shadow: var(--gl-rim), var(--gl-lift); border-radius: 10px; padding: 4px 11px; text-align: center; min-width: 110px; transition: transform .15s ease; }
    .tplbtn:active { transform: scale(.97); }
    .tplbtn.on { border-color: var(--tp-accent); background: var(--gl-sheen), rgba(79,140,255,.18); font-weight: 700; }
    .tplbtn i { display: block; font-style: normal; font-size: .75rem; color: var(--tp-muted); }
    .tplbtn b { display: block; font-size: .88rem; }
    /* پیش‌نمایش برگه‌ها — خودِ برگه‌ها CSS خودشان را از سرور می‌آورند */
    .sheetview { background: #5b6477; border: 1px solid var(--tp-line); border-radius: 12px; padding: 16px; overflow: auto; max-height: 74vh; display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }
    .sheetpage { background: #fff; box-shadow: 0 8px 26px rgba(0,0,0,.35); padding: 8px; flex: 0 0 auto; }
    /* برچسب مرحله بالای هر باکس پایش در سربرگ جزئیات */
    .boxcol { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .boxlab { font-size: .6rem; color: var(--tp-muted); white-space: nowrap; line-height: 1; }
    /* ---------- جدول بررسی سوابق ----------
       چهار گروه، هرکدام یک ته‌رنگ. سرآیند چسبان است، پس سلول‌های سرآیند باید
       رنگ مات داشته باشند وگرنه ردیف‌ها از پشتشان دیده می‌شوند. */
    .grid tbody .g1 { background: rgba(242,194,48,.07) !important; }
    .grid tbody .g2 { background: rgba(79,140,255,.09) !important; }
    .grid tbody .g3 { background: rgba(186,124,255,.09) !important; }
    .grid tbody .g4 { background: rgba(34,197,94,.08) !important; }
    .grid thead .g1 { background: #2a2637 !important; }
    .grid thead .g2 { background: #14274a !important; }
    .grid thead .g3 { background: #251f42 !important; }
    .grid thead .g4 { background: #142f3a !important; }
    .grid th.h-imp { font-weight: 500; font-size: .78rem; color: var(--tp-muted); }
    .grid th.h-w { padding: 3px !important; }
    .grid th.h-w input { width: 54px; text-align: center; border: 1px solid var(--tp-line-2); border-radius: 6px; padding: 2px; background: rgba(3,8,20,.5); color: var(--tp-fg); font-variant-numeric: tabular-nums; }
    .grid th.h-w input[disabled] { opacity: .35; }
    .grid th.h-grp { font-size: .95rem; font-weight: 700; cursor: pointer; user-select: none; }
    .grid th.h-grp:not(.off):hover { filter: brightness(1.4); }
    .grid th.h-grp.off { cursor: not-allowed; opacity: .5; }
    .grid th.h-grp .car { color: var(--tp-accent); font-size: .8rem; }
    /* سلول‌های زردِ «رتبه» — کلیک روی هرکدام، مرتب‌سازی جدول را عوض می‌کند */
    .grid td.rkcol { background: rgba(226,197,126,.13) !important; color: #f2d79a; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
    .grid td.rkcol:hover { background: rgba(226,197,126,.28) !important; }
    .grid thead th.rkcol { background: #3a3320 !important; color: #f6e3b0; cursor: pointer; }
    .grid thead th.rkcol:hover { background: #4a4126 !important; }
    .grid th.sorted { box-shadow: inset 0 -3px 0 var(--tp-accent); }
    .grid tbody tr.sel td { background: rgba(79,140,255,.15) !important; }
    .supname { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
    .supname:hover { color: var(--tp-accent); }
    /* رتبهٔ داخل پرانتز کنار هر عدد، و راهنمای رنگ نمودار روند */
    .rkp { color: #f2d79a; font-size: .72rem; }
    .chlegend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 8px; font-size: .82rem; }
    .chlegend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-inline-end: 5px; vertical-align: middle; }
    /* ستون باریکِ رتبه کنار هر عدد */
    .grid .rkcol { width: 46px; min-width: 46px; padding-inline: 4px !important; text-align: center; }
    /* دکمهٔ کوچکِ مرتب‌سازی کارتابل با مهلت — بالای ستون «باقی‌مانده» */
    .sortbtn { display: block; margin: 0 auto 3px; font: inherit; font-size: .66rem; line-height: 1.3; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--gl-edge); background: var(--gl-sheen), var(--gl-fill); box-shadow: var(--gl-rim); color: var(--tp-muted); cursor: pointer; white-space: nowrap; }
    .sortbtn:hover { background: var(--gl-sheen), var(--gl-fill-hover); }
    .sortbtn.on { background: var(--gl-tint-sheen), var(--gl-tint); border-color: var(--gl-tint-edge); box-shadow: var(--gl-tint-rim); color: #fff; }
    /* نمودار روند — پنجرهٔ بزرگ وسط صفحه */
    .chart-bg { position: fixed; inset: 0; z-index: 940; background: rgba(3,8,20,.74); display: flex; align-items: center; justify-content: center; padding: 2vh 2vw; backdrop-filter: blur(3px); }
    .chart-box { background: #0b1730; color: #eef4ff; border: 1px solid rgba(158,197,255,.25); border-radius: 16px; width: min(1260px, 96vw); max-height: 95vh; overflow: auto; padding: 18px 22px 20px; box-shadow: 0 24px 70px rgba(0,0,0,.55); }
    .chart-head { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; font-size: 1.25rem; }
    .chart-head button { margin-inline-start: auto; }
    .chart-box svg { display: block; width: 100%; height: auto; direction: ltr; background: rgba(3,8,20,.5); border: 1px solid var(--tp-line); border-radius: 12px; }
    .chart-box .chlegend { font-size: 1.1rem; gap: 8px 24px; margin-top: 14px; }
    .chart-box .chlegend i { width: 15px; height: 15px; }
    /* کارت تأمین‌کننده */
    .prof { border: 1px solid var(--tp-accent); border-radius: 12px; background: rgba(79,140,255,.08); padding: 14px 16px; margin-bottom: 14px; }
    /* نرمال‌سازی اقلام — پنل زیر عنوان قلم در تب سوابق */
    .normbox { border: 1px dashed var(--tp-line-2); border-radius: 12px; background: rgba(3,8,20,.35); padding: 12px 14px; margin: 6px 0 12px; }
    /* طرح «خرید هوشمند» فاز ۱: کادرِ «سپردن به کارشناس هوشمند» و 🔒/🔓ِ هر لایه */
    .lockbtn { flex: 0 0 auto; min-width: 2.3em; }
    .lockbtn.on { border-color: rgba(245,158,11,.7); }
    .normgrid { display: grid; grid-template-columns: minmax(180px, 260px) 1fr; gap: 14px; align-items: start; }
    @media (max-width: 760px) { .normgrid { grid-template-columns: 1fr; } }
    .normlayer { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; flex-wrap: wrap; }
    .normlayer select { width: 150px; }
    .normlayer input { flex: 1; min-width: 120px; }
    /* لایهٔ کمّی: عدد و واحدِ جدا — عدد باریک، واحد از فهرستِ واحدهای هم‌بُعد */
    .normlayer input.num { flex: 0 1 150px; min-width: 90px; }
    .normlayer select.nu { width: 130px; }
    /* تیکِ «قلم انتخابی» جلوی هر لایه — نه جای فیلد متن را بگیرد نه ردیف را بشکند */
    .normlayer input[type=checkbox] { flex: 0 0 auto; min-width: 0; width: 18px; height: 18px; margin: 0; accent-color: var(--tp-accent); }
    .normcost { font-size: .8rem; }
    /* نرخ‌های تبدیل: فرمول‌های تبدیلِ پویا (فرمول ۱، ۲، …) — به‌کاررفته پررنگ، بی‌لایه کم‌رنگ */
    .normrates .fxcell { white-space: normal; min-width: 260px; max-width: 460px; font-size: .84rem; line-height: 1.6; text-align: start; }
    .fxl { margin: 0; padding-inline-start: 0; list-style: none; }
    .fxl li { padding: 3px 0; border-bottom: 1px dotted var(--tp-line-2); }
    .fxl li:last-child { border-bottom: 0; }
    .fxl li.miss { opacity: .6; }
    .fxl li.used { color: #86efac; }
    .fxl .fxv { font-size: .78rem; color: var(--tp-dim, #94a3b8); direction: rtl; }
    .fxl li.used .fxv { color: #86efac; }
    .fxw { margin-top: 4px; font-size: .78rem; color: #fcd34d; }
    :root[data-theme="light"] .fxl li.used, :root[data-theme="light"] .fxl li.used .fxv { color: #15803d; }
    :root[data-theme="light"] .fxw { color: #b45309; }
    .seg { display: inline-flex; gap: 4px; }
    .chkline { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
    .chip.grade { font-weight: 800; min-width: 1.8em; text-align: center; }
    .chip.gA { background: rgba(34,197,94,.16); border-color: rgba(34,197,94,.5); color: #6ee7b7; }
    .chip.gB { background: rgba(79,140,255,.16); border-color: rgba(79,140,255,.5); color: #bcd6ff; }
    .chip.gC { background: rgba(242,194,48,.14); border-color: rgba(242,194,48,.45); color: #fcd34d; }
    details.histitems { margin: 4px 0 10px; }
    details.histitems summary { cursor: pointer; color: var(--tp-dim); font-size: .88rem; margin-bottom: 6px; }
    details.histitems .chip { margin: 2px; white-space: normal; }
    .prof .top { display: flex; align-items: baseline; gap: 12px; }
    .prof h4 { margin: 0; font-size: 1.05rem; }
    .prof .gridp { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px 22px; margin-top: 10px; }
    .prof .f b { display: block; font-size: .78rem; color: var(--tp-muted); font-weight: 400; }
    .prof .desc { margin-top: 10px; border-top: 1px solid var(--tp-line); padding-top: 8px; font-size: .9rem; }
    /* نتایج جستجوی هوشمند و بررسی دستیِ پیام‌رسان‌ها (همان مدل دمو) */
    .smres td { vertical-align: top; }
    .phcell { display: flex; gap: 6px; align-items: flex-start; }
    .hamb { min-width: 26px; padding: 0 6px; }
    .hamb.on { border-color: var(--tp-accent); background: var(--gl-sheen), rgba(79,140,255,.2); }
    .chrow > td { background: rgba(3,8,20,.35); }
    .chx { border-collapse: collapse; margin: 4px 0; }
    .chx th, .chx td { padding: 3px 10px; text-align: center; font-size: .8rem; border: 0; }
    .chx th { color: var(--tp-muted); font-weight: 500; }
    .tri { width: 34px; height: 24px; border: 1px solid var(--tp-line-2); border-radius: 6px; background: var(--gl-sheen); box-shadow: var(--gl-rim); display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: .95rem; padding: 0; cursor: pointer; color: inherit; }
    .tri.ok { background: var(--gl-sheen), rgba(34,197,94,.16); border-color: var(--tp-ok); color: #4ade80; }
    .tri.no { background: var(--gl-sheen), rgba(239,68,68,.16); border-color: #ef4444; color: #f87171; }
    .tri.unk { color: #8b9698; border-style: dashed; }
    .smcost { font-size: .72rem; margin-top: 6px; }
    /* چند جستجوی یک قلم: تازه بالا و برجسته، قبلی‌ها پایین و کم‌رنگ‌تر */
    .smblock { border: 1px solid var(--tp-line); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; background: rgba(3,8,20,.25); }
    .smblock.fresh { border-color: var(--tp-ok); box-shadow: inset 0 0 0 1px rgba(34,197,94,.35); background: rgba(34,197,94,.06); }
    .smblock.prev { opacity: .88; }
    .smblock.prev[open] { opacity: 1; }
    .smhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; font-size: .9rem; cursor: default; }
    summary.smhead { cursor: pointer; list-style: none; margin-bottom: 0; }
    details[open] > summary.smhead { margin-bottom: 8px; }
    summary.smhead::-webkit-details-marker { display: none; }
    summary.smhead::before { content: "▸"; color: var(--tp-muted); }
    details[open] > summary.smhead::before { content: "▾"; }
    .smprev-title { font-weight: 700; margin: 6px 0 8px; color: var(--tp-muted); }
    .chms { display: flex; gap: 4px; flex-wrap: wrap; margin: 1px 0 4px; }
    .chm { font-size: .68rem; border-radius: 6px; padding: 0 5px; line-height: 1.5; }
    .chm.ok { background: rgba(34,197,94,.16); color: #4ade80; }
    .chm.no { background: rgba(239,68,68,.14); color: #f87171; }

    /* ---------- حالت روز (panel.css متغیرها را عوض می‌کند؛ این‌ها رنگ‌های ثابتِ همین صفحه‌اند) ---------- */
    :root[data-theme="light"] .strip { background: rgba(255,255,255,.6); }
    :root[data-theme="light"] .pill { background: #fff; }
    :root[data-theme="light"] .pill.sel { background: rgba(47,111,228,.1); }
    :root[data-theme="light"] .endbar, :root[data-theme="light"] .two .side { background: #f7f9fc; }
    :root[data-theme="light"] .tplbtn { background: var(--gl-sheen), #fff; }
    :root[data-theme="light"] .tplbtn.on { background: var(--gl-sheen), rgba(47,111,228,.12); }
    :root[data-theme="light"] .sheetview { background: #c9d1de; }
    :root[data-theme="light"] .grid thead .g1 { background: #f6efd6 !important; }
    :root[data-theme="light"] .grid thead .g2 { background: #dde8fb !important; }
    :root[data-theme="light"] .grid thead .g3 { background: #ebe3fb !important; }
    :root[data-theme="light"] .grid thead .g4 { background: #dcf1e9 !important; }
    :root[data-theme="light"] .grid th.h-w input { background: #fff; }
    :root[data-theme="light"] .grid td.rkcol { background: rgba(217,164,6,.12) !important; color: #6b4e04; }
    :root[data-theme="light"] .grid td.rkcol:hover { background: rgba(217,164,6,.24) !important; }
    :root[data-theme="light"] .grid thead th.rkcol { background: #f3e6bf !important; color: #5c4304; }
    :root[data-theme="light"] .grid thead th.rkcol:hover { background: #ecd9a1 !important; }
    :root[data-theme="light"] .grid tbody tr.sel td { background: rgba(47,111,228,.12) !important; }
    :root[data-theme="light"] .rkp { color: #8a6508; }
    :root[data-theme="light"] .sortbtn:not(.on) { color: var(--tp-muted); }
    :root[data-theme="light"] .chart-bg { background: rgba(15,27,51,.4); }
    :root[data-theme="light"] .chart-box { background: #fff; color: var(--tp-fg); border-color: var(--tp-line-2); box-shadow: 0 24px 60px rgba(20,40,80,.22); }
    :root[data-theme="light"] .chart-box svg { background: #f8fafd; }
    :root[data-theme="light"] .chart-box svg text { fill: #3b4a66; }
    :root[data-theme="light"] .chart-box svg line { stroke: rgba(30,60,120,.2); }
    :root[data-theme="light"] .chart-box svg circle { stroke: #fff; }
    :root[data-theme="light"] .prof { background: rgba(47,111,228,.06); }
    :root[data-theme="light"] .normbox { background: rgba(47,111,228,.04); }
    :root[data-theme="light"] .chip.gA { background: rgba(22,163,74,.1); border-color: rgba(22,163,74,.4); color: #15803d; }
    :root[data-theme="light"] .chip.gB { background: rgba(47,111,228,.1); border-color: rgba(47,111,228,.4); color: #1d4ed8; }
    :root[data-theme="light"] .chip.gC { background: rgba(224,172,8,.12); border-color: rgba(224,172,8,.45); color: #7a5a05; }
    :root[data-theme="light"] .hamb.on { background: var(--gl-sheen), rgba(47,111,228,.14); }
    :root[data-theme="light"] .chrow > td { background: #f5f8fc; }
    :root[data-theme="light"] .tri.ok { background: var(--gl-sheen), rgba(22,163,74,.12); color: #15803d; }
    :root[data-theme="light"] .tri.no { background: var(--gl-sheen), rgba(214,58,63,.1); color: #b91c1c; }
    :root[data-theme="light"] .tri.unk { color: #8a94a6; }
    :root[data-theme="light"] .smblock { background: #fff; }
    :root[data-theme="light"] .smblock.fresh { background: rgba(22,163,74,.05); }
    :root[data-theme="light"] .chm.ok { background: rgba(22,163,74,.12); color: #15803d; }
    :root[data-theme="light"] .chm.no { background: rgba(214,58,63,.1); color: #b91c1c; }
    /* کادر فشردهٔ «وبسایت»: فلش ↗ سمت راست، کرهٔ زمین سمت چپ، نشانی کامل در title */
    .sitebtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--gl-edge); background: var(--gl-sheen), var(--gl-fill); box-shadow: var(--gl-rim); color: var(--tp-fg); border-radius: 8px; padding: 3px 9px; font-size: .82rem; text-decoration: none; white-space: nowrap; line-height: 1.4; }
    .sitebtn:hover { background: var(--gl-sheen), var(--gl-fill-hover); border-color: var(--tp-accent); }
    .sitebtn svg { width: 14px; height: 14px; display: block; }
    .sitebtn .glb { color: var(--tp-accent); }
    /* «محل تحویل» + خانهٔ «سایر»: زیر هم، نه کنار هم — سلول‌های جدول nowrap اند و کادرِ
       تمام‌عرض روی یک خط، از سلول بیرون می‌زد و روی ستون‌های کناری می‌افتاد */
    .q td .stack { display: flex; flex-direction: column; gap: 4px; align-items: stretch; }
    .q td .stack .tp-input { width: 100%; box-sizing: border-box; min-width: 0; }
    /* پیش‌نمایش نامهٔ کمیسیون — همان چیدمانی که روی سربرگ Word می‌نشیند:
       مخاطب و موضوع بالا، بندها با تورفتگی، «با تشکر» و امضا سمت چپ. */
    .letterpaper { border: 1px solid var(--tp-line); border-radius: 12px; background: rgba(3,8,20,.35); padding: 22px 26px; line-height: 2.1; font-size: .95rem; }
    .letterpaper .lt-to { font-weight: 700; }
    .letterpaper .lt-sub { margin-top: 10px; }
    .letterpaper .lt-sal { margin-top: 10px; }
    .letterpaper p { margin: 10px 0 0; text-align: justify; text-indent: 1.6em; }
    .letterpaper .lt-sign { margin-top: 22px; text-align: left; line-height: 1.9; }
    :root[data-theme="light"] .letterpaper { background: #fff; }
    /* گوشی: ستونِ اصلی هم‌پهنای صفحه (stretch)؛ با flex-start پهنای پهن‌ترین جدول را می‌گرفت، جدول در قابِ اسکرولش
       جا نمی‌ماند و بیرون‌زدگی‌اش را صفحه می‌بُرید — جدول جستجوی هوشمند چپ‌وراست نمی‌شد */
    @media (max-width: 900px) { .two { flex-direction: column; align-items: stretch; } .two .main { width: 100%; } .two .side { flex: none; width: 100%; } .letterpaper { padding: 16px; } }

.bt-ring:before,.bt-ring i{content:"";position:absolute;inset:calc(var(--s)*-.17);border-radius:50%}
.bt-ring:before{border:var(--w) solid rgba(79,140,255,.16)}
.bt-ring i{background:conic-gradient(from 0deg,transparent 0deg 90deg,#4f8cff 300deg,#b9d3ff 360deg);
-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - var(--w) - .5px),#000 calc(100% - var(--w)));
mask:radial-gradient(farthest-side,transparent calc(100% - var(--w) - .5px),#000 calc(100% - var(--w)));animation:btSpin 1s linear infinite}
.bt-ring i:after{content:"";position:absolute;top:0;left:50%;width:var(--w);height:var(--w);margin-left:calc(var(--w)/-2);border-radius:50%;background:#b9d3ff}

:root[data-theme=light] .bt-ring i{background:conic-gradient(from 0deg,transparent 0deg 90deg,#2f6fe4 300deg,#1c3c8c 360deg)}

:root[data-theme=light] .bt-tx b{color:#0f2a66}

@media (prefers-reduced-motion:reduce){#boot>*{animation:none}.bt-ring i{animation-duration:2.6s}}
}
@keyframes btSpin{to{transform:rotate(360deg)}}
@keyframes btIn{from{opacity:0;transform:translateY(6px)}}</style>
