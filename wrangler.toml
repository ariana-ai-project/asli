# ============================================================
# Cloudflare Worker «asli» — سایت arianaai.website
#
# یک Worker با فایل‌های ثابت (frontend/) + کد سرور برای بخش تأمین و پشتیبانی:
#   /tamin-poshtibani/api/*    → API روی D1 (worker/api.js)
#   هر مسیر دیگر               → فایل ثابت از frontend/
#
# استقرار:  wrangler deploy          (از ریشهٔ همین مخزن)
# تست محلی: wrangler dev --var MANAGER_CODE:1234
#
# رازها در مخزن نیستند (مخزن عمومی است) و با wrangler secret put ست می‌شوند:
#   MANAGER_CODE       کد ورود مدیر
#   TG_BOT_TOKEN       توکن بات کارشناسان (@ArianaSupplyBot)
#   TG_TEAM_BOT_TOKEN  توکن بات کارشناسان ارشد (@Supply_SeniorBot) — اعلان پایش تیم و منوی /tim
#   TG_SP_BOT_TOKEN    توکن بات مکاتبات تأمین‌کنندگان (دموی پنل تأمین‌کننده — worker/sp-bot.js)؛
#                      نام کاربری‌اش را خودِ Worker از getMe می‌خواند و در settings نگه می‌دارد
#   TG_WEBHOOK_SECRET  رازی که تلگرام در هدر X-Telegram-Bot-Api-Secret-Token برمی‌گرداند
#                      (یک راز برای هر چهار بات؛ وبهوکشان جداست)
#   TEXTBEE_API_KEY    کلید درگاه پیامک TextBee (worker/sms.js) — تا ست نشده، پیامک‌ها شبیه‌سازی می‌شوند.
#                      اختیاری: TEXTBEE_DEVICE_ID (شناسهٔ گوشی؛ بی آن، گوشیِ پیش‌فرضِ حساب TextBee)
#   TG_VB_BOT_TOKEN    توکن بات ویس (ویس به متن — worker/voice-bot.js)؛ وبهوکش را Cronِ ویس خودش ثبت می‌کند
#   VOICE_PASS         رمزِ اولیهٔ ورودِ بات ویس و حالتِ صوتِ بات مکاتبات؛ کاربر عوضش کند، هشِ رمزِ تازه در settings
#   ELEVENLABS_API_KEY تبدیل صوت به متن (نامهٔ کمیسیون، پیامِ صوتی، بات ویس)
# ============================================================
name = "asli"
main = "worker.js"
compatibility_date = "2026-09-03"

[vars]
# نشانی عمومی سایت — لینکِ پیامکِ تأمین‌کننده، مینی‌اپ‌ها و وبهوکِ بات مکاتبات با همین ساخته می‌شوند
SITE_ORIGIN = "https://arianaai.website"
# نام کاربری بات؛ راز نیست و برای ساختن لینک t.me لازم است
TG_BOT_USERNAME = "ArianaSupplyBot"
# بات تیمیِ کارشناسان ارشد (اعلان‌های پایش تیم). توکنش راز است: wrangler secret put TG_TEAM_BOT_TOKEN
TG_TEAM_BOT_USERNAME = "Supply_SeniorBot"

# انبار فایل پیش‌فاکتور — سطل خصوصی روی Supabase. آدرس راز نیست؛ کلید سرویس
# با wrangler secret put SUPABASE_SERVICE_KEY ست می‌شود. تا وقتی کلید نباشد،
# مسیرهای فایل با پیام «هنوز وصل نشده» جواب می‌دهند و چیزی نمی‌شکند.
SUPABASE_URL = "https://oonuuddkzgfchlmvhsel.supabase.co"
SUPABASE_BUCKET = "proformas"

[triggers]
# هر دقیقه. دقیقه‌های مضرب ۵ چرخهٔ هشدار مهلت و صف پیام است (خودِ آستانه‌ها فقط در
# ساعات کاری می‌افتند — SLA-06). دقیقه‌های دیگر یک کار از صف جستجوی هوشمندِ بات:
# آن جستجو چند دقیقه طول می‌کشد و فقط اجرای Cron (تا ۱۵ دقیقه) فرصتش را دارد؛
# waitUntil بعد از پاسخ فقط ۳۰ ثانیه. ارسال فوریِ «ارجاع جدید» جدا با waitUntil است.
# دومی Cronِ جدای ویس است (worker/voice-core.js: VOICE_CRON): ویسِ بلندِ صف در اجرای خودش و با سقفِ CPUِ خودش تبدیل
# می‌شود، نه وسطِ چرخهٔ هشدارها؛ وبهوکِ بات ویس را هم همین ثبت می‌کند.
crons = ["* * * * *", "*/2 * * * *"]

[assets]
directory = "./frontend"
binding = "ASSETS"
# فایل‌های ثابت جلوتر از Worker سرو می‌شوند؛ Worker فقط برای مسیرهایی اجرا می‌شود که فایل ندارند
run_worker_first = false

[[d1_databases]]
binding = "DB"
database_name = "tamin-poshtibani"
database_id = "e94d1472-9b2b-4882-ace0-9c3054696a33"
